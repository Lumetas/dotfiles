<?xml version="1.0" encoding="UTF-8"?>
<touchégg version="2">
    <settings>
        <property name="animation_delay">0</property>
        <property name="action_delay">0</property>
        <property name="repeat_delay">50</property>
        <property name="repeat_enabled">true</property>
    </settings>
    
    <application name="All">
        <gesture type="SWIPE" fingers="3" direction="LEFT">
            <action type="SEND_KEYS">
                <repeat>true</repeat>
                <delay>50</delay>
                <on>begin</on>
                <off>end</off>
                <keys>Left</keys>
            </action>
        </gesture>
        
        <gesture type="SWIPE" fingers="3" direction="RIGHT">
            <action type="SEND_KEYS">
                <repeat>true</repeat>
                <delay>50</delay>
                <on>begin</on>
                <off>end</off>
                <keys>Right</keys>
            </action>
        </gesture>

        <gesture type="SWIPE" fingers="4" direction="LEFT">
            <action type="RUN_COMMAND">
                <repeat>false</repeat>
				<command>bash -c 'dharmactl tag.moveTo $(($(dharmactl tag.current) - 1))'</command>
            </action>
        </gesture>

        <gesture type="SWIPE" fingers="4" direction="RIGHT">
            <action type="RUN_COMMAND">
                <repeat>false</repeat>
				<command>bash -c 'dharmactl tag.moveTo $(($(dharmactl tag.current) + 1))'</command>
            </action>
        </gesture>

    </application>
</touchégg>
